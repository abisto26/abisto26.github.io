<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abisto · @abisto26</title>
<meta name="description" content="Play Globe by Abisto and follow @abisto26.">
<meta name="theme-color" content="#8fc6ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b2236" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Abisto · @abisto26">
<meta property="og:image" content="https://abisto26.com/assets/share.png">
<meta property="og:url" content="https://abisto26.com/">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url(assets/fonts/bricolage-grotesque-latin-standard-normal.woff2) format("woff2")}
:root{--ocean:#8fc6ea;--ink:#16323b;--ink-soft:#4f6b74;--chip:rgba(255,255,255,.55);--edge:rgba(255,255,255,.8)}
@media (prefers-color-scheme: dark){:root{--ocean:#0b2236;--ink:#eaf3f6;--ink-soft:#9fb4bc;--chip:rgba(20,38,47,.62);--edge:rgba(255,255,255,.1)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 70% at 50% 30%,color-mix(in srgb,var(--ocean) 55%,#fff) 0%,var(--ocean) 65%) fixed,var(--ocean);
  display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,0px) 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (prefers-color-scheme: dark){body{background:radial-gradient(120% 70% at 50% 30%,#17405e 0%,var(--ocean) 65%) fixed,var(--ocean)}}
main{flex:1;display:grid;place-items:center}
.game{display:block;border-radius:28%;transition:transform .2s}
.game img{display:block;width:min(56vw,240px);height:auto;filter:drop-shadow(0 18px 30px rgba(10,40,90,.3))}
.game:hover{transform:scale(1.03)}.game:active{transform:scale(.97)}
.game:focus-visible{outline:3px solid var(--ink);outline-offset:6px}
footer{display:flex;flex-direction:column;align-items:center;gap:10px}
.socials{display:flex;gap:10px}
.socials a{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:var(--chip);border:1px solid var(--edge);color:var(--ink);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.socials svg{width:22px;height:22px}
.handle{font:600 .85rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink-soft)}
</style>
</head>
<body>
<main>
  <a class="game" href="/globe/" aria-label="Play Globe by Abisto"><img src="assets/globe-logo.png" alt="Globe by Abisto"></a>
</main>
<footer>
  <nav class="socials" aria-label="@abisto26">
    <a href="https://www.instagram.com/abisto26" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
    <a href="https://www.tiktok.com/@abisto26" target="_blank" rel="noopener" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></a>
    <a href="https://www.youtube.com/@abisto26" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg></a>
    <a href="https://www.facebook.com/abisto26" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M13.5 8h-1a2 2 0 0 0-2 2v11M8.5 13h6"/></svg></a>
  </nav>
  <div class="handle">@abisto26</div>
</footer>
</body>
</html>
