.hl{position:relative;z-index:0}
.hl::before{content:"";position:absolute;z-index:-1;inset:-6px -.2em -6px 50%;background:var(--mark);transition:left .3s ease}
a:hover .hl::before,a:focus-visible .hl::before,.game:hover .hl::before,.menu-soon:hover .hl::before{left:-.2em}

.menu{position:fixed;inset:0;z-index:10;background:var(--overlay);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s .25s}
.menu.open{opacity:1;visibility:visible;transition:opacity .25s ease}
.menu nav{display:flex;flex-direction:column;align-items:flex-start;gap:22px;padding:24px}
.menu .close{margin-bottom:6px}
.menu a,.menu span{font:800 16px/1 "Open Sans",system-ui,sans-serif;letter-spacing:.4em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.menu .menu-soon{cursor:default}
.menu .light{font-weight:400}
.menu hr{width:40px;border:0;border-top:2px solid var(--ink);margin:8px 0}
main{flex:1;display:grid;place-items:center}
footer{width:100%;display:flex;flex-direction:column;align-items:center;gap:26px;padding:8px 4px 4px}
.legal,.tagline{font:700 14px/1.2 "Open Sans",system-ui,sans-serif;text-transform:uppercase;color:var(--ink);margin:0}
.tagline{display:none}
@media (min-width:768px){
  footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .legal{grid-column:1;grid-row:1;justify-self:start}
  .socials{grid-column:2;grid-row:1}
  .tagline{display:block;grid-column:3;grid-row:1;justify-self:end}
}
.game{display:flex;flex-direction:column;align-items:center;gap:18px;text-decoration:none;color:var(--ink)}
.game img{display:block;width:min(36vw,170px);height:auto;transition:transform .25s ease}
.game:hover img{transform:translateY(-4px) scale(1.03)}
.game:active img{transform:scale(.97)}
.name{position:relative;font:800 .95rem/1 "Open Sans",system-ui,sans-serif;letter-spacing:.42em;text-transform:uppercase;padding-inline-start:.42em}
.games{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:clamp(28px,8vw,72px)}
.game.soon{cursor:default;user-select:none}
.game.soon img{filter:grayscale(1);opacity:.4}
.game:focus-visible{outline:2px solid var(--ink);outline-offset:10px}
@media (max-width:600px){
  .games{flex-wrap:nowrap;gap:10px;width:100%}
  .game{gap:14px;flex:1 1 0;min-width:0}
  .game img{width:100%;max-width:130px}
  .name{font-size:.72rem;letter-spacing:.3em;padding-inline-start:.3em}
}
.socials{display:flex;gap:24px}
.socials a{color:var(--ink);display:grid;place-items:center;width:28px;height:28px;transition:opacity .15s,transform .15s}
.socials a:hover{opacity:.6}.socials a:active{transform:scale(.9)}
