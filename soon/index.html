<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Abisto26 | Coming soon</title>
<link rel="icon" href="../favicon-96.png">
<style>
@font-face{font-family:Anton;src:url(../assets/fonts/anton-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Open Sans";font-weight:400;src:url(../assets/fonts/open-sans-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Open Sans";font-weight:800;src:url(../assets/fonts/open-sans-latin-800-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Alexandria;font-weight:400;src:url(../assets/fonts/alexandria-arabic-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Alexandria;font-weight:900;src:url(../assets/fonts/alexandria-arabic-900-normal.woff2) format("woff2");font-display:swap}
:root{--sky:#2C99D6;--cloud:#F8FAFC;--sun:#FFC629;--ink:#14212e}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink)}
body{font-family:"Open Sans",system-ui,sans-serif;color:var(--cloud);background:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang=ar] body{font-family:Alexandria,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* top bar: dark on the light first screen, light once the page turns dark */
.bar{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;justify-content:space-between;color:var(--ink);transition:color .4s;
  padding:calc(14px + env(safe-area-inset-top)) clamp(16px,2.4vw,36px) 14px}
.bar.on-dark{color:var(--cloud)}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-size:17px}
.brand img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.brand b{font-weight:800}
.langs{display:flex;gap:16px}
.langs button{font-size:12px;font-weight:800;letter-spacing:.14em;opacity:.5;padding:6px 0;border-bottom:2px solid transparent}
.langs button[aria-pressed=true]{opacity:1;border-color:var(--sun)}

/* pinned scene */
.pin{position:relative;height:320svh}
.scene{position:sticky;top:0;height:100svh;overflow:hidden}
.marq{position:absolute;inset-inline:0;top:50%;z-index:1;transform:translateY(-50%);direction:ltr;pointer-events:none;opacity:0}
.marq div{white-space:nowrap;will-change:transform;line-height:1.02;text-transform:uppercase}
.m1{font-family:Anton,Impact,sans-serif;font-size:min(11vw,17svh);color:var(--sun);letter-spacing:.01em}
.m2{font-weight:800;font-size:min(10vw,15.5svh);color:var(--cloud);letter-spacing:-.02em}
html[lang=ar] .m1,html[lang=ar] .m2{font-family:Alexandria,sans-serif;font-weight:900;font-size:min(9vw,13svh);letter-spacing:0;line-height:1.3}
.frame{position:absolute;inset:0;z-index:2;background:var(--cloud);overflow:hidden;transform-origin:50% 50%;will-change:transform;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.frame.play{touch-action:none}
.frame>svg.lines{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.frame>svg.lines path{fill:none;stroke:rgba(20,33,46,.085);stroke-width:1;vector-effect:non-scaling-stroke}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.stage{--hs:min(145svh,232vw);position:absolute;z-index:2;top:calc(12svh - var(--hs)*.103);left:50%;height:var(--hs);aspect-ratio:4/5;transform:translateX(-50%);transform-origin:50% 42%;will-change:transform}
.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.stage .ghost{opacity:.1;filter:grayscale(1) brightness(1.5) contrast(.8)}
.veil{position:absolute;inset:0;z-index:4;background:#5b6672;mix-blend-mode:multiply;opacity:0;pointer-events:none}
.role{position:absolute;z-index:5;inset-inline-start:clamp(16px,2.4vw,36px);bottom:calc(22px + env(safe-area-inset-bottom));color:var(--ink);
  font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;max-width:22ch;line-height:1.5}
html[lang=ar] .role{letter-spacing:0;font-size:13px}
.touchui{display:none;position:absolute;z-index:6;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom));text-align:center}
.touchui button{background:var(--ink);color:var(--cloud);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;padding:11px 18px;border-radius:99px}
html[lang=ar] .touchui button{letter-spacing:0;font-size:13px}
.frame.play .touchui button{background:var(--sun);color:var(--ink)}
.sign{position:absolute;z-index:3;left:50%;top:50%;width:min(46vw,62svh);transform:translate(-50%,-50%) rotate(-6deg);pointer-events:none;overflow:visible}
.sign path{fill:none;stroke:var(--sun);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.end{position:relative;z-index:3;min-height:60svh;display:grid;place-items:center;text-align:center;padding:40px 20px}
.end p{font-family:Anton,Impact,sans-serif;font-size:clamp(34px,7vw,96px);text-transform:uppercase;line-height:1}
html[lang=ar] .end p{font-family:Alexandria,sans-serif;font-weight:900}
.end p em{font-style:normal;color:var(--sun)}
@media (hover:none){.touchui{display:block}.role{display:none}}
@media (max-width:700px){.sign{width:74vw}.m1{font-size:17vw}.m2{font-size:15.5vw}html[lang=ar] .m1,html[lang=ar] .m2{font-size:14vw}}
</style>
</head>
<body>
<header class="bar" id="bar">
  <a class="brand" href="../" aria-label="Abisto26"><img src="../assets/avatar.webp" alt="" width="36" height="36"><span><b data-i18n="brand">Abisto</b>26</span></a>
  <div class="langs" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="ar">AR</button>
  </div>
</header>

<main>
<div class="pin" id="pin">
  <div class="scene">
    <div class="marq" id="marq" aria-hidden="true">
      <div class="m1" id="m1"></div>
      <div class="m2" id="m2"></div>
    </div>
    <div class="frame" id="frame">
      <svg class="lines" id="lines" aria-hidden="true" preserveAspectRatio="none"></svg>
      <canvas id="bg" aria-hidden="true"></canvas>
      <div class="stage" id="stage">
        <img id="face" src="assets/face.webp" alt="Abisto smiling" data-i18n-alt="alt" width="1200" height="1500">
        <img class="ghost" src="assets/ghost.webp" alt="" width="1200" height="1500">
        <canvas id="cv" aria-hidden="true"></canvas>
      </div>
      <div class="veil" id="veil"></div>
      <p class="role" data-i18n="role">Moroccan rider &amp; content creator</p>
      <div class="touchui"><button id="playbtn" data-i18n="tap">Tap to play</button></div>
    </div>
    <svg class="sign" id="sign" viewBox="0 0 400 260" aria-hidden="true"><path pathLength="1" d="M38 232 L168 26 L206 214 M92 152 C150 118 236 108 252 140 C266 168 232 196 248 160 C260 134 292 118 302 150 C310 178 284 194 300 164 C312 140 338 128 348 152 C362 190 240 244 386 204"/></svg>
  </div>
</div>
<section class="end"><p><span data-i18n="end1">More is</span> <em data-i18n="end2">coming soon</em></p></section>
</main>

<script>
var T={
 en:{brand:'Abisto',role:'Moroccan rider & content creator',m1:'Drawing smiles on people’s faces',m2:'Morocco to the world',tap:'Tap to play',back:'Back to scroll',end1:'More is',end2:'coming soon',alt:'Abisto smiling'},
 fr:{brand:'Abisto',role:'Motard marocain & créateur de contenu',m1:'Dessiner des sourires sur les visages',m2:'Du Maroc au monde entier',tap:'Touche pour jouer',back:'Retour au défilement',end1:'La suite',end2:'arrive bientôt',alt:'Abisto souriant'},
 ar:{brand:'أبيستو',role:'سائق دراجة نارية وصانع محتوى مغربي',m1:'رسم الابتسامة على وجوه الناس',m2:'من المغرب إلى العالم',tap:'المس للّعب',back:'العودة للتمرير',end1:'المزيد',end2:'قريباً',alt:'أبيستو مبتسماً'}
};
var lang='en',play=false;
function setLang(l){
  lang=l;var d=T[l];document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(function(e){e.textContent=d[e.dataset.i18n];});
  document.querySelectorAll('[data-i18n-alt]').forEach(function(e){e.alt=d[e.dataset.i18nAlt];});
  document.querySelectorAll('.langs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===l);});
  var rep=function(s){var o='';for(var i=0;i<6;i++)o+=s+'  ·  ';return o;};
  document.getElementById('m1').textContent=rep(d.m1);document.getElementById('m2').textContent=rep(d.m2);
  document.getElementById('playbtn').textContent=play?d.back:d.tap;
  try{localStorage.setItem('lang',l);}catch(e){}
}
document.querySelectorAll('.langs button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.lang);});});
(function(){var l=null;try{l=localStorage.getItem('lang');}catch(e){}
  if(!l){var n=(navigator.language||'en').slice(0,2);l=T[n]?n:'en';}setLang(l);})();

(function(){
  var frame=document.getElementById('frame'),stage=document.getElementById('stage'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var bg=document.getElementById('bg'),bx=bg.getContext('2d'),pin=document.getElementById('pin'),bar=document.getElementById('bar');
  var marq=document.getElementById('marq'),m1=document.getElementById('m1'),m2=document.getElementById('m2'),veil=document.getElementById('veil');
  var signP=document.querySelector('#sign path'),face=document.getElementById('face'),lines=document.getElementById('lines'),btn=document.getElementById('playbtn');
  var acc=document.createElement('canvas'),ax=acc.getContext('2d',{willReadFrequently:true});
  var tmp=document.createElement('canvas'),tc=tmp.getContext('2d');
  var mk=document.createElement('canvas'),mx=mk.getContext('2d');
  var hel=new Image();hel.src='assets/helmet.webp';
  var HX=.501,HY=.344;                       /* head centre inside the portrait (0..1) */
  var FW=0,FH=0,MW=0,MH=0,W=0,H=0,sx=0,sy=0,sw=0,sh=0;
  var cur=null,prev=null,last=-1e9,prog=0,streaks=[],nextBurst=0,nx=0,ny=0,tnx=0,tny=0;
  var still=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* tileable noise that makes the edge of the shape organic */
  var N=new Float32Array(128*128);
  (function(){var k=6.2832/128;for(var y=0;y<128;y++)for(var x=0;x<128;x++)
    N[x+y*128]=(Math.sin(x*k*3+.7)+Math.sin(y*k*2+1.9)+Math.sin((x+y)*k*4+2.4)+Math.sin((x-y)*k*5+.3)+Math.sin(x*k*9+y*k*7))/5;})();

  function size(){
    FW=frame.clientWidth;FH=frame.clientHeight;sw=stage.offsetWidth;sh=stage.offsetHeight;sx=(FW-sw)/2;sy=stage.offsetTop;
    var dpr=Math.min(window.devicePixelRatio||1,1.5);
    W=cv.width=Math.round(sw*dpr);H=cv.height=Math.round(sh*dpr);
    MW=Math.max(80,Math.round(FW/5));MH=Math.max(60,Math.round(MW*FH/FW));
    [acc,tmp,mk].forEach(function(c){c.width=MW;c.height=MH;});
    bg.width=Math.round(FW/2);bg.height=Math.round(FH/2);
    lines.setAttribute('viewBox','0 0 '+FW+' '+FH);
  }
  size();addEventListener('resize',size);

  function point(e){tnx=e.clientX/innerWidth*2-1;tny=e.clientY/innerHeight*2-1;var r=frame.getBoundingClientRect();cur={x:(e.clientX-r.left)/r.width*MW,y:(e.clientY-r.top)/r.height*MH};last=performance.now();}
  frame.addEventListener('pointermove',point);
  frame.addEventListener('pointerdown',function(e){prev=null;point(e);});
  frame.addEventListener('pointerleave',function(){prev=null;cur=null;});
  function burst(now){var hy=(sy+HY*sh)/FH*MH,hh=.481*sh/FH*MH,n=3+(Math.random()*3|0);
    for(var i=0;i<n;i++)streaks.push({t0:now+i*140+Math.random()*80,dir:Math.random()<.5?1:-1,y:hy+(i/(n-1)-.5+(Math.random()-.5)*.25)*hh*.8,r:Math.min(MW,MH)*(.055+Math.random()*.045),dur:420+Math.random()*220,px:null,ph:Math.random()*6});}
  window.__burst=function(){burst(performance.now());};
  btn.addEventListener('click',function(e){e.stopPropagation();play=!play;frame.classList.toggle('play',play);btn.textContent=play?T[lang].back:T[lang].tap;});

  function stamp(x,y,r,a){var g=ax.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,'+a+')');g.addColorStop(.55,'rgba(255,255,255,'+a*.55+')');g.addColorStop(1,'rgba(255,255,255,0)');
    ax.fillStyle=g;ax.beginPath();ax.arc(x,y,r,0,6.2832);ax.fill();}

  /* slow contour lines in the background */
  var blobs=[];for(var i=0;i<7;i++)blobs.push({cx:Math.random(),cy:Math.random(),r:.16+Math.random()*.3,ph:Math.random()*9,sp:.05+Math.random()*.06,el:document.createElementNS('http://www.w3.org/2000/svg','path')});
  blobs.forEach(function(b){lines.appendChild(b.el);});
  function contours(t){
    blobs.forEach(function(b){var pts=[],n=9;
      for(var i=0;i<n;i++){var a=i/n*6.2832,rr=b.r*(1+.32*Math.sin(a*2+b.ph+t*b.sp)+.2*Math.sin(a*3-b.ph*2+t*b.sp*1.7));
        pts.push([(b.cx+.06*Math.sin(t*b.sp+b.ph)+Math.cos(a)*rr)*FW,(b.cy+Math.sin(a)*rr*1.1)*FH]);}
      var d='';for(i=0;i<n;i++){var p0=pts[(i+n-1)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
        if(!i)d='M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1);
        d+='C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);}
      b.el.setAttribute('d',d+'Z');});
  }
  contours(0);

  function ease(x){return x<0?0:x>1?1:x*x*(3-2*x);}
  var fcount=0;
  function frameTick(now){
    var t=now/1000;fcount++;
    /* scroll progress through the pinned scene */
    var pr=pin.getBoundingClientRect();prog=Math.min(1,Math.max(0,-pr.top/(pin.offsetHeight-innerHeight)));
    var a=ease(prog/.4),b=ease((prog-.45)/.4);
    var s=1-.16*a-.44*b;
    frame.style.transform='scale('+s.toFixed(4)+')';
    marq.style.opacity=ease((prog-.04)/.15);
    m1.style.transform='translate3d('+(-prog*70-4)+'vw,0,0)';m2.style.transform='translate3d('+(prog*70-90)+'vw,0,0)';
    veil.style.opacity=(b*.9).toFixed(3);face.style.filter=b>0?'grayscale('+b.toFixed(2)+')':'';
    signP.style.strokeDashoffset=(1-ease((prog-.62)/.3)).toFixed(4);
    bar.classList.toggle('on-dark',prog>.12);

    /* nobody is moving: every few seconds a burst of fast ribbons crosses the head */
    var idle=now-last>1800;
    if(idle&&!still&&prog<.9){if(!nextBurst)nextBurst=now+900;if(now>nextBurst){nextBurst=now+3000+Math.random()*1400;burst(now);}tnx=.25*Math.sin(t*.5);tny=.15*Math.sin(t*.37+1);}
    /* the portrait turns a little towards the pointer */
    if(!still){nx+=(tnx-nx)*.07;ny+=(tny-ny)*.07;
      stage.style.transform='translateX(-50%) perspective(1200px) translate3d('+(nx*1.6).toFixed(2)+'%,'+(ny*.8).toFixed(2)+'%,0) rotateY('+(nx*11).toFixed(2)+'deg) rotateX('+(-ny*6).toFixed(2)+'deg)';}

    /* fade and drift the old trail, then add the new stroke */
    tc.globalCompositeOperation='copy';tc.globalAlpha=.972;tc.drawImage(acc,0,-.25);
    ax.globalCompositeOperation='copy';ax.globalAlpha=1;ax.drawImage(tmp,0,0);ax.globalCompositeOperation='lighter';
    if(cur){
      if(prev){var dx=cur.x-prev.x,dy=cur.y-prev.y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist>.15){var r=Math.min(MW,MH)*(.17+Math.min(.1,dist*.006)),n=Math.max(1,Math.ceil(dist/(r*.35)));
          for(var i=1;i<=n;i++)stamp(prev.x+dx*i/n,prev.y+dy*i/n,r,Math.min(.7,.3+dist*.04));}}
      prev={x:cur.x,y:cur.y};
    }
    for(var q=streaks.length-1;q>=0;q--){var S=streaks[q],u=(now-S.t0)/S.dur;if(u<0)continue;
      var X=S.dir>0?(-.15+u*1.3)*MW:(1.15-u*1.3)*MW,Y=S.y+Math.sin(u*4+S.ph)*MH*.012;
      if(S.px!==null){var ddx=X-S.px,nn=Math.max(1,Math.ceil(Math.abs(ddx)/(S.r*.35)));for(var j=1;j<=nn;j++)stamp(S.px+ddx*j/nn,Y,S.r,.55);}
      S.px=X;if(u>=1)streaks.splice(q,1);}
    /* hard, wobbly edge */
    var im=ax.getImageData(0,0,MW,MH),d=im.data,ox=(t*9)&127,oy=(t*5)&127,x,y,i4=3,v;
    for(y=0;y<MH;y++){var row=((y+oy)&127)<<7;for(x=0;x<MW;x++,i4+=4){v=d[i4];
      if(v<24){d[i4]=0;continue;}v+=N[((x+ox)&127)+row]*42;d[i4]=v<118?0:v>134?255:(v-118)*16;d[i4-1]=d[i4-2]=d[i4-3]=255;}}
    mx.putImageData(im,0,0);

    /* pale shape on the background, helmet inside the same shape */
    bx.globalCompositeOperation='source-over';bx.clearRect(0,0,bg.width,bg.height);bx.imageSmoothingEnabled=true;
    bx.drawImage(mk,0,0,bg.width,bg.height);bx.globalCompositeOperation='source-in';bx.fillStyle='#e2e7ec';bx.fillRect(0,0,bg.width,bg.height);
    ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,W,H);
    if(hel.complete&&hel.naturalWidth){
      var k=MW/FW,k2=MH/FH,x0=Math.max(0,sx),y0=Math.max(0,sy),x1=Math.min(FW,sx+sw),y1=Math.min(FH,sy+sh);
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      ctx.drawImage(mk,x0*k,y0*k2,(x1-x0)*k,(y1-y0)*k2,(x0-sx)/sw*W,(y0-sy)/sh*H,(x1-x0)/sw*W,(y1-y0)/sh*H);
      ctx.globalCompositeOperation='source-in';ctx.drawImage(hel,0,0,W,H);
    }
    if(!still&&fcount%2===0)contours(t);
    requestAnimationFrame(frameTick);
  }
  requestAnimationFrame(frameTick);
})();
</script>
</body>
</html>
