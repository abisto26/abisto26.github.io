<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Abisto26 | Coming soon</title>
<link rel="icon" href="../favicon-96.png">
<style>
@font-face{font-family:Anton;src:url(../assets/fonts/anton-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Open Sans";font-weight:400;src:url(../assets/fonts/open-sans-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Open Sans";font-weight:800;src:url(../assets/fonts/open-sans-latin-800-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Alexandria;font-weight:400;src:url(../assets/fonts/alexandria-arabic-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Alexandria;font-weight:900;src:url(../assets/fonts/alexandria-arabic-900-normal.woff2) format("woff2");font-display:swap}
:root{--sky:#2C99D6;--cloud:#F8FAFC;--sun:#FFC629;--ink:#14212e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Open Sans",system-ui,sans-serif;color:#fff;background:var(--sky);-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:Alexandria,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* top bar */
.bar{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) clamp(16px,2.4vw,36px) 14px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:17px;letter-spacing:.01em}
.brand img{width:36px;height:36px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.brand b{font-weight:800}
.langs{display:flex;gap:16px}
.langs button{font-size:12px;font-weight:800;letter-spacing:.14em;opacity:.6;padding:6px 0;border-bottom:2px solid transparent}
.langs button[aria-pressed=true]{opacity:1;border-color:var(--sun)}

/* hero */
.hero{position:relative;height:100svh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;
  background:linear-gradient(180deg,#2C99D6 0%,#2C99D6 38%,#69b8e4 72%,#dff0fa 100%)}
.name{position:absolute;inset-inline:0;top:13svh;z-index:1;text-align:center;white-space:nowrap;direction:ltr;
  font-family:Anton,Impact,sans-serif;font-weight:400;font-size:min(24vw,50svh);line-height:.92;letter-spacing:.005em;text-transform:uppercase;
  will-change:transform}
.name em{font-style:normal;color:var(--sun)}
html[lang=ar] .name{font-family:Alexandria,sans-serif;font-weight:900;font-size:min(17.5vw,40svh);direction:rtl;top:15svh;line-height:1.1}
.cloud{position:absolute;z-index:2;pointer-events:none;will-change:transform;filter:drop-shadow(0 18px 30px rgba(20,60,100,.18))}
.c1{width:min(34vw,470px);left:-4vw;top:44svh}
.c2{width:min(26vw,360px);right:-3vw;top:20svh}
.c3{width:min(40vw,560px);right:-8vw;bottom:-6svh;z-index:4}
.stage{position:absolute;z-index:3;bottom:0;left:50%;height:min(88svh,112vw);aspect-ratio:4/5;transform:translateX(-50%);will-change:transform}
.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.stage img{filter:drop-shadow(0 30px 40px rgba(10,40,70,.28))}
.tag,.hint{position:absolute;z-index:5;bottom:calc(26px + env(safe-area-inset-bottom));color:var(--ink);max-width:min(30ch,38vw)}
.tag{inset-inline-start:clamp(16px,2.4vw,36px);font-weight:800;font-size:clamp(15px,1.45vw,21px);line-height:1.25}
.tag small{display:block;font-weight:400;font-size:.72em;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px;opacity:.75}
html[lang=ar] .tag small{letter-spacing:0}
.hint{inset-inline-end:clamp(16px,2.4vw,36px);text-align:end;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  display:flex;align-items:center;gap:10px}
html[lang=ar] .hint{letter-spacing:0;font-size:14px}
.hint i{width:12px;height:12px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 0 rgba(255,198,41,.7);animation:pulse 1.8s infinite}
@keyframes pulse{to{box-shadow:0 0 0 14px rgba(255,198,41,0)}}
.hint .touch{display:none}
.soon{position:absolute;z-index:5;top:calc(74px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:var(--sun);color:var(--ink);font-weight:800;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:6px 14px;border-radius:99px;white-space:nowrap}
html[lang=ar] .soon{letter-spacing:0;font-size:12px}

@media (hover:none){.hint .mouse{display:none}.hint .touch{display:inline}}
@media (max-width:700px){
  .name{top:17svh;font-size:min(25.5vw,24svh)}
  html[lang=ar] .name{top:18svh;font-size:min(19vw,18svh)}
  .stage{height:min(70svh,150vw)}
  .c1{width:52vw;left:-16vw;top:40svh}.c2{width:42vw;right:-12vw;top:30svh}.c3{width:66vw;right:-22vw;bottom:5svh}
  .tag,.hint{position:absolute;inset-inline:16px;max-width:none;text-align:center;justify-content:center}
  .tag{bottom:calc(46px + env(safe-area-inset-bottom));font-size:15px;color:#fff;text-shadow:0 1px 10px rgba(10,40,70,.6)}
  .tag small{display:none}
  .hint{bottom:calc(16px + env(safe-area-inset-bottom));font-size:11px;color:#fff;text-shadow:0 1px 10px rgba(10,40,70,.6)}
  .langs{gap:14px}
}
@media (prefers-reduced-motion:reduce){.hint i{animation:none}}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="../" aria-label="Abisto26"><img src="../assets/avatar.webp" alt="" width="36" height="36"><span><b data-i18n="brand">Abisto</b>26</span></a>
  <div class="langs" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="ar">AR</button>
  </div>
</header>

<main class="hero" id="hero">
  <div class="soon" data-i18n="soon">New site coming soon</div>
  <h1 class="name" id="name"><span data-i18n="name">Abisto</span><em>26</em></h1>
  <img class="cloud c1" src="../assets/cloud-1.webp" alt="" data-k="26">
  <img class="cloud c2" src="../assets/cloud-2.webp" alt="" data-k="14">
  <div class="stage" id="stage">
    <img id="face" src="assets/face.webp" alt="Abisto smiling" data-i18n-alt="alt" width="800" height="1000">
    <canvas id="cv" aria-hidden="true"></canvas>
  </div>
  <img class="cloud c3" src="../assets/cloud-3.webp" alt="" data-k="44">
  <p class="tag"><small data-i18n="role">Moroccan rider &amp; content creator</small><span data-i18n="motto">Drawing smiles on people’s faces, Morocco to the world.</span></p>
  <p class="hint" aria-live="polite"><i></i><span class="mouse" data-i18n="hintMouse">Move over my face · click to lock</span><span class="touch" data-i18n="hintTouch">Slide your finger · tap to lock</span></p>
</main>

<script>
var T={
 en:{brand:'Abisto',name:'Abisto',soon:'New site coming soon',role:'Moroccan rider & content creator',motto:'Drawing smiles on people’s faces, Morocco to the world.',
     hintMouse:'Move over my face · click to lock',hintTouch:'Slide your finger · tap to lock',unlock:'Tap again to take it off',alt:'Abisto smiling'},
 fr:{brand:'Abisto',name:'Abisto',soon:'Nouveau site bientôt',role:'Motard marocain & créateur de contenu',motto:'Dessiner des sourires sur les visages, du Maroc au monde entier.',
     hintMouse:'Passe sur mon visage · clique pour garder',hintTouch:'Glisse ton doigt · touche pour garder',unlock:'Touche encore pour l’enlever',alt:'Abisto souriant'},
 ar:{brand:'أبيستو',name:'أبيستو',soon:'الموقع الجديد قريباً',role:'سائق دراجة نارية وصانع محتوى مغربي',motto:'رسم الابتسامة على وجوه الناس، من المغرب إلى العالم.',
     hintMouse:'مرّر على وجهي · اضغط للتثبيت',hintTouch:'حرّك إصبعك · المس للتثبيت',unlock:'المس مرة أخرى لنزع الخوذة',alt:'أبيستو مبتسماً'}
};
var lang='en',locked=false;
function setLang(l){
  lang=l;var d=T[l];document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(function(e){e.textContent=d[e.dataset.i18n];});
  document.querySelectorAll('[data-i18n-alt]').forEach(function(e){e.alt=d[e.dataset.i18nAlt];});
  document.querySelectorAll('.langs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===l);});
  hintText();
  try{localStorage.setItem('lang',l);}catch(e){}
}
function hintText(){var d=T[lang];document.querySelector('.hint .mouse').textContent=locked?d.unlock:d.hintMouse;document.querySelector('.hint .touch').textContent=locked?d.unlock:d.hintTouch;}
document.querySelectorAll('.langs button').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();setLang(b.dataset.lang);});});
(function(){var l=null;try{l=localStorage.getItem('lang');}catch(e){}
  if(!l){var n=(navigator.language||'en').slice(0,2);l=T[n]?n:'en';}setLang(l);})();

/* ---- helmet reveal: a liquid shape follows the pointer and shows the helmet over the face ---- */
(function(){
  var hero=document.getElementById('hero'),stage=document.getElementById('stage'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var mk=document.createElement('canvas'),mx=mk.getContext('2d',{willReadFrequently:true});
  var hel=new Image();hel.src='assets/helmet.webp';
  var clouds=[].slice.call(document.querySelectorAll('.cloud')),nameEl=document.getElementById('name');
  var HX=.506,HY=.268;               /* head centre inside the portrait (0..1) */
  var W=0,H=0,MW=0,MH=0,box=null;
  var tx=HX,ty=HY,px=HX,py=HY,last=-1e9,trail=[],lockT=0,vx=.5,vy=.5,svx=.5,svy=.5;
  var still=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){
    var r=stage.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
    box=r;W=cv.width=Math.round(r.width*dpr);H=cv.height=Math.round(r.height*dpr);
    MW=mk.width=Math.max(60,Math.round(r.width/4));MH=mk.height=Math.round(MW*r.height/r.width);
  }
  size();addEventListener('resize',size);
  function point(e){
    box=stage.getBoundingClientRect();
    tx=(e.clientX-box.left)/box.width;ty=(e.clientY-box.top)/box.height;
    vx=e.clientX/innerWidth;vy=e.clientY/innerHeight;last=performance.now();
  }
  var moved=0,down=null;
  hero.addEventListener('pointermove',function(e){point(e);if(down)moved+=Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y),down={x:e.clientX,y:e.clientY};});
  hero.addEventListener('pointerdown',function(e){point(e);down={x:e.clientX,y:e.clientY};moved=0;});
  hero.addEventListener('pointerup',function(){if(down&&moved<12){locked=!locked;hintText();}down=null;});
  hero.addEventListener('pointercancel',function(){down=null;});
  function blob(x,y,r){
    var g=mx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');
    mx.fillStyle=g;mx.beginPath();mx.arc(x,y,r,0,6.2832);mx.fill();
  }
  function frame(now){
    var t=now/1000;
    if(now-last>2200&&!still){                       /* nobody is touching: wander around the head */
      tx=HX+.2*Math.sin(t*.9)+.05*Math.sin(t*2.3);ty=HY+.13*Math.sin(t*1.25+1)+.03*Math.cos(t*2.9);
      vx=.5+.25*Math.sin(t*.4);vy=.5+.2*Math.cos(t*.3);
    }
    px+=(tx-px)*.16;py+=(ty-py)*.16;svx+=(vx-svx)*.06;svy+=(vy-svy)*.06;
    trail.push({x:px,y:py,l:1});
    for(var i=trail.length-1;i>=0;i--){trail[i].l-=.03;if(trail[i].l<=0)trail.splice(i,1);}
    lockT+=((locked?1:0)-lockT)*.07;
    mx.clearRect(0,0,MW,MH);
    var R=MW*.36;
    for(i=0;i<trail.length;i++){var p=trail[i],e=p.l*p.l*(3-2*p.l);blob(p.x*MW,p.y*MH,R*(.25+.75*e));}
    for(i=0;i<3;i++){var a=t*(1.1+i*.37)+i*2.1;blob(px*MW+Math.cos(a)*R*.42,py*MH+Math.sin(a*1.3)*R*.42,R*.62);}
    if(lockT>.004){mx.fillStyle='#fff';mx.beginPath();mx.arc(HX*MW,HY*MH,lockT*MH*1.1,0,6.2832);mx.fill();
      for(i=0;i<5;i++){a=t*.8+i*1.256;blob(HX*MW+Math.cos(a)*lockT*MH*1.05,HY*MH+Math.sin(a)*lockT*MH*1.05,R*.9*lockT+1);}}
    var im=mx.getImageData(0,0,MW,MH),d=im.data;       /* hard, liquid edge */
    for(i=3;i<d.length;i+=4){var v=d[i];d[i]=v<104?0:v>140?255:(v-104)*7;}
    mx.putImageData(im,0,0);
    ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,W,H);
    if(hel.complete&&hel.naturalWidth){
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      ctx.drawImage(mk,0,0,W,H);ctx.globalCompositeOperation='source-in';ctx.drawImage(hel,0,0,W,H);
    }
    if(!still){                                        /* soft depth: clouds, name and portrait drift */
      var ox=svx-.5,oy=svy-.5;
      clouds.forEach(function(c){var k=+c.dataset.k;c.style.transform='translate3d('+(-ox*k)+'px,'+(-oy*k*.6+Math.sin(t*.5+k)*4)+'px,0)';});
      nameEl.style.transform='translate3d('+(ox*18)+'px,'+(oy*10)+'px,0)';
      stage.style.transform='translateX(-50%) translate3d('+(-ox*10)+'px,'+(-oy*6)+'px,0)';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__helmet={lock:function(v){locked=v;hintText();}};
})();
</script>
</body>
</html>
